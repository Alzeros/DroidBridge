<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="12" y1="12" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b6cf6"/>
      <stop offset="52%" stop-color="#5b57f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="topCyanGlow" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomDepth" cx="0.16" cy="0.88" r="0.62">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="128" y1="12" x2="128" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="134" y1="172" x2="188" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#141a4a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded squircle base -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#topCyanGlow)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bottomDepth)"/>
  <rect x="13" y="13" width="230" height="230" rx="55" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Suspension bridge: deck, towers, main cable, hangers; node dot & flow arrow -->
  <g filter="url(#softShadow)">
    <path d="M 48 150 C 58 96 76 70 91 70 C 110 70 112 114 128 114 C 144 114 146 70 165 70 C 180 70 198 96 208 150"
          fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M 110 96 L 110 150 M 128 114 L 128 150 M 146 96 L 146 150"
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <rect x="84" y="48" width="14" height="102" rx="7" fill="#ffffff"/>
    <rect x="158" y="48" width="14" height="102" rx="7" fill="#ffffff"/>
    <rect x="44" y="150" width="168" height="16" rx="8" fill="#ffffff"/>
    <circle cx="114" cy="196" r="8" fill="#34d399"/>
    <path d="M 142 196 L 178 196 M 164 180 L 181 196 L 164 212"
          fill="none" stroke="url(#accentGrad)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
